name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Repo Safety, Python, and JavaScript Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check for unresolved merge conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})([[:space:]]|$)' -- ':!tests/js/static_scripts.test.mjs'; then
            echo "Unresolved merge conflict markers found!"
            exit 1
          fi

      - name: Validate YAML and JSON files
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          import yaml

          for path in list(Path('.github').rglob('*.yml')) + [Path('.pre-commit-config.yaml')]:
              with path.open('r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print(f"YAML OK: {path}")

          for path in Path('.').rglob('*.json'):
              if '.venv' in path.parts or 'node_modules' in path.parts:
                  continue
              with path.open('r', encoding='utf-8') as f:
                  json.load(f)
              print(f"JSON OK: {path}")
          EOF

      - name: Python syntax and static lint checks
        run: |
          python -m compileall -q dj_ajax/src
          ruff check --select=E9,F63,F7,F82 --exclude '**/migrations/**' dj_ajax/src

      - name: Django system, migration, and unit test checks
        run: |
          python dj_ajax/src/manage.py check
          python dj_ajax/src/manage.py makemigrations --check --dry-run
          python dj_ajax/src/manage.py test posts profiles

      - name: JavaScript syntax check
        run: |
          find dj_ajax/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: JavaScript unit tests
        run: node --test tests/js/static_scripts.test.mjs
