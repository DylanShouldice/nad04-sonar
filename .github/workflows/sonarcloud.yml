name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Build, Test, and SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r requirements.txt

      - name: Run Django system check
        run: python dj_ajax/src/manage.py check

      - name: Run tests and generate coverage report
        run: |
          coverage run --rcfile=.coveragerc dj_ajax/src/manage.py test posts profiles
          coverage xml --rcfile=.coveragerc -o coverage.xml

      - name: Run JavaScript tests and generate LCOV coverage
        run: |
          node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=lcov.info --test-reporter=spec --test-reporter-destination=stdout tests/js/static_scripts.test.mjs

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
