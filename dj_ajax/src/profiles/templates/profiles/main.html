{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'profiles/main.css' %}">
{% endblock styles %}

{% block scripts %}
    <script src="{% static 'profiles/main.js' %}" defer></script>
{% endblock scripts %}

{% block title %}
    My Profile
{% endblock title %}

{% block content %}
    <div id="alert-box"></div>
    <h3>{{obj.user}}</h3>
    <hr>
    <div class="text-center" id="avatar-box">
        <img src="{{obj.avatar.url}}" alt="{{obj.user.username}}" class="rounded" width="auto" height="200px">
    </div>
    <form id="profile-form">
        {% csrf_token %}
        {{form|crispy}}
        <button type="submit" class="btn btn-primary mt-3"> Save </button>
    </form>
{% endblock content %}
